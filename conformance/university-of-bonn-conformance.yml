generated: '2026-09-01'
method: probed
source: >-
  Live probes of University-of-Bonn-operated hosts on 2026-09-01 (bonndata.uni-bonn.de,
  bonndoc.ulb.uni-bonn.de, shibboleth.uni-bonn.de, gitlab.uni-bonn.de), plus the DFN-AAI
  federation metadata aggregate (mdq.aai.dfn.de) and the DataCite, ROR and re3data
  registry records. Every claim below is evidenced by a fetched response, never by a
  prose claim on a web page.
docs: https://www.hrz.uni-bonn.de/en/all-services/data-storage-fileservices/bonndata
note: >-
  Scored against the Kin Score `education` regime standards[]: scim, lti, oneroster,
  ed-fi, caliper, qti, oai-pmh, shibboleth, saml, orcid, datacite, crossref. Only
  standards with a fetched, quotable response are marked conforms: true. REWARD-ONLY —
  an absent standard is recorded as false with the probe that failed, never invented.
  The University of Bonn publishes no institution-authored OpenAPI; the four OpenAPI
  documents in this repo are API-Evangelist-authored descriptions of the public read
  subset of the Dataverse Native API as deployed on the university's own host, and are
  marked as such in openapi/_original/.
standards:
- id: oai-pmh
  conforms: true
  evidence: >-
    Two institution-operated OAI-PMH 2.0 endpoints answered verb=Identify with valid
    OAI-PMH XML on 2026-09-01. bonndata: https://bonndata.uni-bonn.de/oai?verb=Identify
    -> 200 text/xml, repositoryName "bonndata Dataverse OAI Archive", protocolVersion
    2.0, adminEmail bonndata@uni-bonn.de, earliestDatestamp 2025-07-24T00:00:08Z,
    granularity YYYY-MM-DDThh:mm:ssZ, deletedRecord transient, gzip/deflate compression.
    verb=ListMetadataFormats returns Datacite, oai_dc, oai_datacite, oai_ddi and
    dataverse_json; verb=ListSets returns institution sets including
    Bonn_Center_Digital_Humanities, Bonn_Mathematics, Medical_Faculty and ZEF. bonndoc:
    https://bonndoc.ulb.uni-bonn.de/oai/request?verb=Identify -> 200 text/xml,
    repositoryName "bonndoc - Der Publikationsserver der Universitaet Bonn",
    protocolVersion 2.0, adminEmail bonndoc@ulb.uni-bonn.de, earliestDatestamp
    2016-09-29T14:25:33Z, repositoryIdentifier bonndoc.ulb.uni-bonn.de, sampleIdentifier
    oai:bonndoc.ulb.uni-bonn.de:20.500.11811/1234. Its ListMetadataFormats returns
    oai_dc, mods, mets, didl, ore, xMetaDissPlus, xoai, dim, uketd_dc and qdc. The
    OAI-PMH protocol is OAI's; the deployments, the hosts and the metadata are Bonn's.
  evidence_urls:
  - https://bonndata.uni-bonn.de/oai?verb=Identify
  - https://bonndata.uni-bonn.de/oai?verb=ListMetadataFormats
  - https://bonndoc.ulb.uni-bonn.de/oai/request?verb=Identify
- id: shibboleth
  conforms: true
  evidence: >-
    The University of Bonn operates its own Shibboleth Identity Provider and publishes
    signed SAML metadata from its own host: https://shibboleth.uni-bonn.de/idp/shibboleth
    -> 200 application/xml, 12,145 bytes, entityID
    https://shibboleth.uni-bonn.de/idp/shibboleth, OrganizationName "Rheinische
    Friedrich-Wilhelms-Universitaet Bonn". The same entity is registered in DFN-AAI, the
    German national research-and-education identity federation: the aggregate at
    https://mdq.aai.dfn.de/entities/ (200, 112,936,662 bytes, 11,457 EntityDescriptors)
    carries exactly one uni-bonn.de entity — the Bonn IdP — with registrationAuthority
    https://www.aai.dfn.de, mdui:DisplayName "Universitaet Bonn", shibmd:Scope
    uni-bonn.de, entity attributes DFN-AAI-IdP and
    http://aai.dfn.de/category/idm.nrw-member, and a valid XML signature. Per-entity MDQ
    lookup also answers: https://mdq.aai.dfn.de/entities/https%3A%2F%2Fshibboleth.uni-bonn.de%2Fidp%2Fshibboleth
    -> 200 application/samlmetadata+xml, 22,552 bytes.
  evidence_urls:
  - https://shibboleth.uni-bonn.de/idp/shibboleth
  - https://mdq.aai.dfn.de/entities/https%3A%2F%2Fshibboleth.uni-bonn.de%2Fidp%2Fshibboleth
- id: saml
  conforms: true
  evidence: >-
    SAML 2.0 declared and bound on Bonn's own IdP entity
    (protocolSupportEnumeration urn:oasis:names:tc:SAML:2.0:protocol). Endpoints read
    from the metadata on 2026-09-01: SingleSignOnService over HTTP-POST
    (https://shibboleth.uni-bonn.de/idp/profile/SAML2/POST/SSO), HTTP-POST-SimpleSign and
    HTTP-Redirect (.../SAML2/Redirect/SSO); SingleLogoutService over Redirect, POST,
    POST-SimpleSign and SOAP; ArtifactResolutionService at
    https://shibboleth.uni-bonn.de:8443/idp/profile/SAML2/SOAP/ArtifactResolution; an
    AttributeAuthorityDescriptor is present alongside the IDPSSODescriptor.
  evidence_urls:
  - https://shibboleth.uni-bonn.de/idp/shibboleth
- id: datacite
  conforms: true
  evidence: >-
    The University of Bonn is a DataCite member organization and mints DOIs for its
    research data. https://api.datacite.org/providers/bxbq -> 200: symbol BXBQ, name
    "University of Bonn", memberType consortium_organization, rorId
    https://ror.org/041nas322. The repository client is bonndata, symbol BXBQ.UDHDYC,
    clientType repository, url https://bonndata.uni-bonn.de/, joined 2023; DOI prefix
    10.60507 resolves to that client
    (https://api.datacite.org/prefixes/10.60507 -> 200). Confirmed in the data itself: a
    live bonndata search result carries global_id doi:10.60507/FK2/BBP6GG, and the OAI-PMH
    endpoint serves the Datacite and oai_datacite metadata prefixes. This is a registry
    MEMBERSHIP — a fact about Bonn — not a Bonn-operated contract.
  evidence_urls:
  - https://api.datacite.org/providers/bxbq
  - https://api.datacite.org/prefixes/10.60507
  - https://api.datacite.org/clients/bxbq.udhdyc
- id: orcid
