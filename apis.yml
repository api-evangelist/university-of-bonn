  detail: >-
    Bonn is one of the thin-cohort exceptions: it operates a real, anonymous, public read
    API on its own host and it was fully reachable. Every path in the four OpenAPI
    documents was re-probed on 2026-09-01 and returned 200 with the expected payload
    (/search 376 datasets, /search/services, /info/version 6.7.1 build 1955-8e18f64,
    /info/metrics/datasets 376, /datasets/:persistentId, /datasets/export?exporter=oai_dc),
    and both institution OAI-PMH endpoints answered verb=Identify. Two honest limits are
    recorded rather than smoothed over. First, the HTML side of bonndata and bonndoc sits
    behind an Anubis bot challenge that answers HTTP 200 with a 7,540-byte "Making sure
    you're not a bot!" page — so /openapi, /llms.txt and /.well-known/agent.json all
    return 200 while carrying nothing, and none of them is credited here; the /api and
    /oai paths are unaffected. Second, the ULB digital collections host
    (digitale-sammlungen.ulb.uni-bonn.de) returns a hard 403 to every request including
    its OAI path, so whatever IIIF or harvesting surface it runs could not be read. What
    is absent is absent, not unreachable: no llms.txt, sitemap.xml, apis.json or agent
    card exists on www.uni-bonn.de (all 404), and there is no developer portal to gate.
