description: >-
  The University of Bonn (Rheinische Friedrich-Wilhelms-Universitaet Bonn), founded in
  1818, is a public research university in North Rhine-Westphalia, Germany, and a member
  of the German Universities Excellence Initiative. Like every institution it is a
  federation of buyers rather than an API producer, but it is an unusually self-hosted
  one: the surfaces in this profile run on the university's own hosts, inside its own
  computing centre, rather than on a vendor's multi-tenant platform. bonndata, the
  institutional cross-disciplinary research data repository, runs Dataverse 6.7.1 at
  bonndata.uni-bonn.de (CNAME bonndata-produktiv.rhrz.uni-bonn.de, 131.220.213.19) and
  exposes a genuinely public, anonymous, read-only REST API — /search, /datasets,
  /datasets/export, /info/version, /info/metrics — plus a full OAI-PMH 2.0 endpoint;
  every documented path was re-verified live on 2026-09-01 and /search returned 376
  indexed datasets. bonndoc, the university publication server at bonndoc.ulb.uni-bonn.de,
  answers OAI-PMH in ten metadata formats. The university runs its own Shibboleth Identity
  Provider at shibboleth.uni-bonn.de and is the only uni-bonn.de entity in the 11,457-entity
  DFN-AAI federation aggregate. It self-hosts GitLab at gitlab.uni-bonn.de, whose REST API
  v4 answers anonymously across 195 public projects, and keeps a GitHub organization at
  github.com/unibonn. It is a DataCite member (BXBQ) minting DOIs under prefix 10.60507
  through the bonndata repository client, is registered in ROR as 041nas322 and in re3data
  as r3d100014222. What it does NOT have is equally clear and is stated here rather than
  padded: no central developer portal, no institution-authored OpenAPI or AsyncAPI, no
  llms.txt, sitemap.xml, apis.json or agent card on any host it controls, no public course,
  timetable or student-information API (BASIS runs HISinOne behind sign-in, eCampus runs
  ILIAS), and no institutional open-data portal — opendata.bonn.de belongs to the City of
  Bonn, not the university. Library discovery (bonnus) is Ex Libris Primo, self-hosted on a
  university IP, with no public API. The four OpenAPI documents in this repo are
  API-Evangelist-authored descriptions of the public read subset of the Dataverse Native API
  as deployed by Bonn; the Dataverse contract itself belongs to the Dataverse project, and
  no vendor specification is saved under this institution.
