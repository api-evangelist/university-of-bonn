  - date: '2026-09-01'
    rating: 4
    summary: >-
      University pipeline re-profile with operator attribution. Confirmed bonndata is
      institution-operated infrastructure, not a vendor tenancy: bonndata.uni-bonn.de
      CNAMEs to bonndata-produktiv.rhrz.uni-bonn.de (131.220.213.19), the university
      computing centre. Re-probed every path in the four saved OpenAPI documents — all
      200, /search now total_count 376 (362 in June), Dataverse 6.7.1 build 1955-8e18f64.
      Three institution-operated surfaces the June profile missed were found and added:
      the bonndoc DSpace publication server's OAI-PMH endpoint (ten metadata formats,
      Handle prefix 20.500.11811), a self-hosted GitLab whose REST API v4 answers
      anonymously over 195 public projects, and the university's own Shibboleth IdP,
      which is the ONLY uni-bonn.de entity among 11,457 EntityDescriptors in the DFN-AAI
      federation aggregate. Registry memberships recorded: DataCite BXBQ / client
      bonndata BXBQ.UDHDYC / prefix 10.60507, ROR 041nas322, re3data r3d100014222.
      Two corrections to the June profile: the OAI-PMH endpoint serves Datacite, oai_dc,
      oai_datacite, oai_ddi and dataverse_json — NOT OAI-ORE and OpenAIRE as previously
      claimed; and the welded OpenAPI titles ("... Datasets Info API", "... Datasets
      Metrics API", "... Datasets Search API") were our own refine artifact and are
      repaired. Soft-200 trap recorded, not credited: the HTML side of bonndata and
      bonndoc sits behind an Anubis bot challenge, so /openapi, /llms.txt and
      /.well-known/agent.json all return HTTP 200 carrying a 7,540-byte "Making sure
      you're not a bot!" page. No vendor contract is attributed to the institution and
      no endpoint was fabricated.
